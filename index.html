<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalpalatha Book Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">📖 <span>Kalpalatha<br>Book Store</span></div>
  <input id="search" placeholder="Search for books, stationery..." oninput="render()">
  <button class="cartTop" onclick="showCart()">🛒 Cart <b id="count">0</b></button>
</header>
<nav>
  <button onclick="home()">Home</button>
  <button onclick="showBooks()">Books</button>
  <button onclick="showStationery()">Stationery</button>
  <button onclick="showCart()">Cart</button>
</nav>

<main id="app"></main>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>Kalpalatha Book Store • PHX3+73R, Ward 20, Sarvakatta, Proddatur, Andhra Pradesh 516360 • 094400 41999</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
